# mAuction uses a local H2 database and requires Vault plus an economy provider.
config-version: 2

# Bundled languages: en_US and ru_RU. Unknown values fall back to en_US.
language: en_US

listing:
  # Clamped to 1..100 at runtime.
  limit-per-player: 10
  # Clamped to 1..720 hours (30 days).
  duration-hours: 48
  sell-cooldown-seconds: 2
  maximum-serialized-bytes: 1048576
  blocked-materials: [BEDROCK, BARRIER, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK, STRUCTURE_BLOCK, JIGSAW]

price:
  minimum: 1.0
  maximum: 1000000000.0

economy:
  # Clamped to 0..100 so a bad value cannot mint money or charge a negative payout.
  tax-percent: 5.0
  fraction-digits: 2

gui:
  # The visible title is translated through lang/<language>.yml.
  title: ""
  # Open menus verify their visible listing states every 20 ticks by default.
  live-refresh-ticks: 20
  page-size: 45
  purchase-confirmation: true

transactions:
  reservation-timeout-seconds: 300
  audit-retention-days: 180

metrics:
  enabled: true
  bstats-id: 27943
